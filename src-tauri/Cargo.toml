[package]
name = "shellmosaic"
version = "0.4.1"
description = "A modular, workspace-based terminal for Windows"
edition = "2021"
rust-version = "1.80"
# src/bin/shellmosaic-agent.rs is the Orchestrator's hook/MCP shim; the app is this one
default-run = "shellmosaic"

[lib]
name = "shellmosaic_lib"
# rlib only: the MinGW linker can't export a cdylib this large ("export ordinal too large"),
# and cdylib/staticlib are only needed for mobile targets.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
sysinfo = "0.39"
netstat2 = "0.11"
parking_lot = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
trash = "5"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["sync", "time", "net", "fs", "io-util", "io-std", "macros", "rt"] }
# SSH: ring instead of aws-lc-rs (no cmake/NASM needed on the MinGW toolchain)
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
# the host vault
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
# HTTPS for the Claude usage check: the same reqwest + rustls (ring) build the updater already uses
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# optional modules: the catalog is signed with the updater's key (same minisign check as the updater)
minisign-verify = "0.3"
sha2 = "0.10"
semver = "1"
# SQLite Browser module (bundled: no system SQLite on Windows; column_decltype for result
# column types, hooks for the authorizer that keeps ATTACH to local files)
rusqlite = { version = "0.41", features = ["bundled", "column_decltype", "hooks"] }

[target.'cfg(windows)'.dependencies]
# ntdll functions windows-sys doesn't cover (thread states, handle tables, suspend/resume)
windows-link = "0.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_EventLog",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Unoptimized key derivation takes seconds (vault unlock, encrypted SSH keys) and
# makes debug builds feel broken; optimize just the crypto crates.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.bcrypt-pbkdf]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
